---
name: Build macOS App ZIP

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-26

    env:
      CI_VERSION: ${{ inputs.ci_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: true
          add-tools-to-path: true
          version: 6.11.2
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e

      - name: Download macOS dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 setup-deps.py

      - name: Build Moonlight
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build
          cd build

          qmake ../moonlight-qt.pro \
            CONFIG+=release \
            QMAKE_APPLE_DEVICE_ARCHS=arm64

          make -j"$(sysctl -n hw.ncpu)" release

      - name: Deploy application bundle
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build -type d -name 'Moonlight.app' -print -quit)"

          if [[ -z "${APP_PATH}" ]]; then
            echo "Moonlight.app was not found after build"
            find build -maxdepth 6 -print
            exit 1
          fi

          echo "Found app at: ${APP_PATH}"

          macdeployqt "${APP_PATH}" \
            -qmldir=app/gui \
            -always-overwrite

      - name: Archive Moonlight.app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build -type d -name 'Moonlight.app' -print -quit)"

          if [[ -z "${APP_PATH}" ]]; then
            echo "Moonlight.app was not found"
            exit 1
          fi

          mkdir -p archive

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "${APP_PATH}" \
            "archive/Moonlight-${CI_VERSION}.app.zip"

          ls -lh archive

      - name: Upload macOS application
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-macOS-App-${{ env.CI_VERSION }}
          path: archive/Moonlight-${{ env.CI_VERSION }}.app.zip
          compression-level: 0
          if-no-files-found: error
