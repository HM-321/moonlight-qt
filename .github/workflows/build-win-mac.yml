---
name: Build macOS App ZIP

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-26

    env:
      CI_VERSION: ${{ inputs.ci_version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: true
          add-tools-to-path: true
          version: 6.11.2
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e

      - name: Cache macOS dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: libs/mac
          key: moonlight-macos-deps-v1-${{ hashFiles('setup-deps.py') }}

      - name: Download macOS dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 setup-deps.py

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: moonlight-macos-ccache-${{ github.sha }}
          restore-keys: |
            moonlight-macos-ccache-

      - name: Restore incremental build
        uses: actions/cache@v4
        with:
          path: build
          key: moonlight-macos-build-v1-${{ github.sha }}
          restore-keys: |
            moonlight-macos-build-v1-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

          mkdir -p "${CCACHE_DIR}"

          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --set-config=compression=true
          ccache --zero-stats

          echo "$(brew --prefix ccache)/libexec" >> "${GITHUB_PATH}"

      - name: Build Moonlight
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build
          cd build

          qmake ../moonlight-qt.pro \
            CONFIG+=release \
            QMAKE_APPLE_DEVICE_ARCHS=arm64 \
            "QMAKE_CC=ccache clang" \
            "QMAKE_CXX=ccache clang++"

          make -j"$(sysctl -n hw.ncpu)" release

      - name: Deploy application bundle
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/app/Moonlight.app"

          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Moonlight.app was not found"
            find build -maxdepth 6 -print
            exit 1
          fi

          macdeployqt "${APP_PATH}" \
            -qmldir=app/gui \
            -appstore-compliant \
            -always-overwrite

          echo "Application bundle:"
          du -sh "${APP_PATH}"

          echo "Frameworks:"
          ls -lh "${APP_PATH}/Contents/Frameworks" | head -50

      - name: Verify application dependencies
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/app/Moonlight.app"
          BIN="${APP_PATH}/Contents/MacOS/Moonlight"

          test -x "${BIN}"

          otool -L "${BIN}"

          if otool -L "${BIN}" |
              grep -E '/Users/runner|/opt/homebrew|/usr/local'; then
            echo "Absolute build-machine dependency found"
            exit 1
          fi

      - name: Archive Moonlight.app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/app/Moonlight.app"

          rm -rf archive
          mkdir -p archive

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "${APP_PATH}" \
            "archive/Moonlight-${CI_VERSION}.app.zip"

          ls -lh archive

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true
          ccache --show-config || true

      - name: Upload macOS application
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-macOS-App-${{ env.CI_VERSION }}
          path: archive/Moonlight-${{ env.CI_VERSION }}.app.zip
          compression-level: 0
          if-no-files-found: error
